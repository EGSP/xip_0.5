# Приёмники трассировок для локальной разработки.
#
# Программа отправляет спаны по протоколу OTLP на адрес из OTEL_EXPORTER_OTLP_ENDPOINT.
# Протокол стандартный, поэтому приёмник меняется без единой правки в коде — достаточно
# указать другой адрес. Оба сервиса могут работать одновременно на разных портах.
#
#   docker compose up -d
#
#   Phoenix (диалог, сообщения, стоимость):  http://localhost:6006
#     OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:6006
#
#   Jaeger (водопад спанов, общая латентность): http://localhost:16686
#     OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
#
services:
    # Специализированный приёмник для LLM: раскладывает спан обращения к модели на сообщения
    # и показывает их перепиской, а вызовы инструментов — отдельными карточками.
    phoenix:
        image: arizephoenix/phoenix:latest
        container_name: xip_phoenix
        restart: unless-stopped
        ports:
            - '6006:6006' # веб-интерфейс и приём OTLP по HTTP
        environment:
            - PHOENIX_WORKING_DIR=/data
        volumes:
            - phoenix-data:/data

    # Универсальный приёмник трассировок. Диалог не разбирает, но показывает точный водопад
    # по времени — из него сразу видно, что заняло время прогона.
    jaeger:
        image: jaegertracing/all-in-one:1.62.0
        container_name: xip_jaeger
        restart: unless-stopped
        environment:
            - COLLECTOR_OTLP_ENABLED=true
        ports:
            - '16686:16686' # веб-интерфейс
            - '4318:4318' # приём OTLP по HTTP
            - '4317:4317' # приём OTLP по gRPC

volumes:
    phoenix-data:
